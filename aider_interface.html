<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aider Interface</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        textarea {
            width: 100%;
            height: 300px;
        }
        button {
            padding: 10px 20px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>Aider Interface</h1>
    <textarea id="input" placeholder="Enter your command here..."></textarea>
    <button onclick="runAider()">Run Aider</button>
    <pre id="output"></pre>

    <script>
        async function runAider() {
            const input = document.getElementById('input').value;
            const output = document.getElementById('output');
            output.textContent = 'Running Aider...';

            try {
                const response = await fetch('/run_aider', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ command: input })
                });

                if (response.ok) {
                    const result = await response.text();
                    output.textContent = result;
                } else {
                    output.textContent = `Error: ${response.status} - ${response.statusText}`;
                }
            } catch (error) {
                output.textContent = `Error: ${error.message}`;
            }
        }
    </script>
</body>
</html>
